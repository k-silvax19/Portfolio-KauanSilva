<section id="habilidades">
  <div class="container my-5">

    <h2 class="display-5 fw-medium fst-italic text-center">
      Tecnologias
    </h2>

    <p class="mt-5 fs-5 text-center">
      Conheça as tecnologias que eu utilizo no dia a dia como desenvolvedor!
    </p>

    <ul class="list-unstyled row row-cols-1 row-cols-lg-2 gx-5 gy-4 mt-5">

      @for (tecnologia of tecnologias; track tecnologia.titulo) {

        <li class="col">

          <article class="d-flex align-items-center gap-4 h-100 border-bottom pb-4">

            <img
              width="64"
              height="64"
              [src]="tecnologia.imagem"
              [alt]="tecnologia.titulo"
            />

            <div>
              <h3 class="fs-4 fw-medium fst-italic">
                {{ tecnologia.titulo }}
              </h3>

              <p class="fs-5 mb-0">
                {{ tecnologia.descricao }}
              </p>
            </div>

          </article>

        </li>

      }

    </ul>

  </div>
</section>
